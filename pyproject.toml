[project]
name = "raglicious-chatbot-backend"
version = "0.1.0"
description = "AI Chatbot with RAG"
readme = "README.md"
authors = [
    { email = "sey.adegun@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
raglicious-chatbot-backend = "raglicious_chatbot_backend:main"

# [build-system]
# requires = ["uv_build>=0.12.18,<0.13.0"]
# build-backend = "uv_build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
